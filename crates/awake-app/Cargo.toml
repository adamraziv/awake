[package]
name = "awake-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "awake-app"
path = "src/main.rs"

[lib]
name = "awake_app"
path = "src/lib.rs"

[dependencies]
awake-proto = { path = "../awake-proto" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tracing-appender = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSString", "NSObject", "NSThread", "NSURL", "NSError", "NSNotification",
    "NSArray", "NSEnumerator", "NSDictionary", "NSProcessInfo", "NSData",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "NSApplication", "NSResponder", "NSStatusBar", "NSStatusItem", "NSStatusBarButton",
    "NSMenu", "NSMenuItem", "NSImage", "NSCell", "NSControl", "NSButton", "NSView",
    "NSWorkspace", "NSRunningApplication", "objc2-core-foundation",
] }
objc2-service-management = { version = "0.3", default-features = false, features = [
    "std", "objc2", "objc2-foundation", "SMAppService",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std", "CFBase", "CFString", "CFDictionary", "CFNumber", "CFRunLoop", "CFArray",
] }
objc2-io-kit = { version = "0.3", default-features = false, features = ["std", "libc", "pwr_mgt", "ps"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
