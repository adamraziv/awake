[package]
name = "awake-helper"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "awake-helper"
path = "src/main.rs"

[dependencies]
awake-proto = { path = "../awake-proto" }
libc = "0.2"

[lib]
name = "awake_helper"
path = "src/lib.rs"

# Runs its own main so the signal mask matches the real helper; see the file's header.
[[test]]
name = "signal_reset"
harness = false
